# Temporary (SP-D 35.9): the AI model labels each day of the owner's channels for the news event study.
# Uses GROQ_API_KEY (never printed); no database, no bot. Deleted with its branch once read.
name: probe-news-labels
on:
  push:
    branches: [probe-news-labels]
permissions:
  contents: write
jobs:
  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2
      - run: python research/label_news_days.py 320
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - if: always()
        run: |
          git config user.name "probe" && git config user.email "probe@users.noreply.github.com"
          git add -f research/data/news_days.jsonl
          git commit -m "News days labelled (temporary)" || true
          git push origin HEAD:probe-news-labels
