name: Task C Tests
on:
  workflow_dispatch:
jobs:
  test:
    # Pinned, not ubuntu-latest: GitHub moves ubuntu-latest to Ubuntu 26 from 2026-10-19, and a
    # runner change under the pins broke production once already (SP_D_HANDOFF.md 28, 35.5).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_momentum.py
      - run: python tests/test_database.py
