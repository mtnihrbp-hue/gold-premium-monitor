name: KPI Suite

# Regression net for the executable phase specifications in kpi/.
# Runs against an isolated in-memory database and never receives DATABASE_URL,
# so it cannot reach production Neon.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - SP-C
      - SP-D
  pull_request:

jobs:

  kpi:

    # Pinned, not ubuntu-latest: GitHub moves ubuntu-latest to Ubuntu 26 from 2026-10-19, and a
    # runner change under the pins broke production once already (SP_D_HANDOFF.md 28, 35.5).
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q src

      - name: KPI suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONIOENCODING: "utf-8"
        run: python kpi/run_all.py
