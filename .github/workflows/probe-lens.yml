# Temporary (SP-D 86): the LENS rendered once on GitHub's runner with the AI model's key, sending nothing
# (no Telegram token, no database). The message goes to the log and to the run's notices. Deleted with its branch.
name: probe-lens
on:
  push:
    branches: [probe-lens]
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: The lens, rendered
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python research/probe_translate.py || true
          echo skipped > lens.txt
          cat lens.txt
          python - <<'PY'
          text = open("lens.txt", encoding="utf-8").read()
          start = text.find("GOLDPremium: LENS")
          body = text[start:] if start >= 0 else text[-3000:]
          for i in range(0, len(body), 900):
              print("::notice::" + body[i:i + 900].replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
