# Temporary (SP-D 86, 98): the LENS's headlines sorted by several Groq models and two prompts, three rounds each,
# sending nothing (no Telegram token, no database). The result is the run's artifact. Deleted with its branch.
name: probe-lens
on:
  push:
    branches: [probe-lens]
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2 beautifulsoup4==4.15.0 lxml==6.1.3
      - name: The models compared
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python research/probe_lens_models.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-lens-models
          path: probe_lens_models.json
          retention-days: 2
