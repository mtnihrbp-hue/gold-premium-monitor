name: Gold Premium Monitor

# The Analyze path requires SCHEDULED_RUN=true. A plain workflow_dispatch is not a
# schedule event, so an external scheduler posting to the dispatches endpoint would
# otherwise silently run the UPDATE path and produce no analytical history.
# The caller therefore declares intent, which keeps the Live and Analyze wings separate:
# a user /Update stays UPDATE, and only an explicit mode=analyze runs the pipeline.
#
# mode=direction is read-only in the same way: it renders the DIRECTION panel the
# scheduled runs stored at 06:00 and 13:00 Tehran, for the Telegram /Direction command.
#
# mode=report is the third wing and writes nothing at all. It answers the Telegram
# /Analyze command by reading persisted state. skills/telegram-product.md requires
# that "a user request must not silently become an Analysis Wing execution or
# historical learning observation", so a reader asking what the record shows must not
# collect prices, must not create a snapshot, and must not produce an outcome.

run-name: >-
  ${{ github.event.inputs.mode == 'direction' && 'DIRECTION'
      || github.event.inputs.mode == 'report' && 'REPORT'
      || ((github.event_name == 'schedule' || github.event.inputs.mode == 'analyze')
          && 'ANALYZE' || 'UPDATE') }}

on:

  workflow_dispatch:
    inputs:
      mode:
        description: "Which wing to run"
        type: choice
        required: false
        default: update
        options:
          - update
          - analyze
          - report
          - direction

# The GitHub native schedule was removed on 2026-09-20. Do not re-add it.
#
# GitHub only runs `schedule` events on the default branch, so it fired main's
# workflow with main's code against production Neon once a day, regardless of where
# development was happening. main carries none of this sprint's fixes, so the
# 2026-09-19 run was cancelled by the job timeout after the unbounded collector
# subprocess stalled.
#
# The Analysis Wing is driven by cron-job.org, which posts to the dispatches endpoint
# hourly with an explicit ref and inputs.mode=analyze, so it runs the branch that is
# actually current. The native schedule duplicated that at 14:30 UTC, in the same
# minute, with stale code.
#
# Removed from main in c1799fe and mirrored here so the merge does not reintroduce it.
# See PROJECT_OPERATIONS.md, "Branch ref control plane".

jobs:

  run:

    # Pinned, not ubuntu-latest: GitHub moves ubuntu-latest to Ubuntu 26 from 2026-10-19, and a
    # runner change under the pins broke production once already (SP_D_HANDOFF.md 28, 35.5).
    runs-on: ubuntu-24.04
    # The Analyze path has been exceeding 10 minutes and being cancelled, which is why
    # roughly half of recent scheduled runs produced no analysis snapshot.
    timeout-minutes: 20

    steps:

      - uses: actions/checkout@v4

      # One-off recovery, to be removed after 2026-11-01 (SP_D_HANDOFF.md section 37.14). The runs of
      # 2026-10-16 12:30 and 13:30 UTC cached the state under a four-file list. A cache entry belongs
      # to its exact list of paths, so those runs could not see the entries before them and started
      # from an empty state and spool. Their own held writes are restored here, set aside, and added
      # once to the spool the next step restores; state.json marks it done.
      - name: Recover the writes held under the four-file cache
        id: recover
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            candle_cache.json
            record_spool.jsonl
            record_mirror.sqlite
          key: gold-monitor-state-recover-none
          restore-keys: |
            gold-monitor-state-

      - name: Set the recovered writes aside
        if: steps.recover.outputs.cache-matched-key != ''
        run: |
          mkdir -p recovered
          if [ -f record_spool.jsonl ]; then mv record_spool.jsonl recovered/record_spool.jsonl; fi
          rm -f state.json candle_cache.json record_mirror.sqlite

      - name: Restore State
        uses: actions/cache@v4
        with:
          # NEVER change this list. A cache entry belongs to its exact list of paths: a run with a
          # different list cannot see the entries saved before it and starts from an empty state.json
          # and spool. Adding a file here lost the spool's first three days on 2026-10-16
          # (SP_D_HANDOFF.md section 37.14; kpi_coherence.test_52). A new file gets its own cache step.
          # candle_cache.json: the daily candles kept between runs, so a run fetches only the new
          # days (src/persistence/candle_cache.py; Neon's monthly transfer, SP_D_HANDOFF.md 34).
          # record_spool.jsonl: what a run could not write while Neon was out of reach, written back
          # by the next scheduled run that reaches it (src/persistence/spool.py, SP_D_HANDOFF.md 35.4).
          path: |
            state.json
            candle_cache.json
            record_spool.jsonl
          key: gold-monitor-state-${{ github.run_id }}
          restore-keys: |
            gold-monitor-state-

      - name: Add the recovered writes once
        if: steps.recover.outputs.cache-matched-key != ''
        run: |
          python3 - <<'PY'
          import json, os
          state = json.load(open("state.json")) if os.path.exists("state.json") else {}
          path = "recovered/record_spool.jsonl"
          if not state.get("recovered_2026_10_16") and os.path.exists(path):
              lines = [l for l in open(path, encoding="utf-8") if l.strip()]
              with open("record_spool.jsonl", "a", encoding="utf-8") as f:
                  f.writelines(lines)
              state["recovered_2026_10_16"] = True
              json.dump(state, open("state.json", "w"))
              print(f"recovered {len(lines)} held writes")
          else:
              print("nothing to recover")
          PY

      - name: Restore the record mirror
        uses: actions/cache@v4
        with:
          # record_mirror.sqlite: the last 60 days of readings, copied from Neon by each scheduled run,
          # for the reads a run makes while Neon is out of reach (src/persistence/mirror.py, 37.12).
          # Its own entry, so the state's list above never changes.
          path: record_mirror.sqlite
          key: gold-monitor-mirror-${{ github.run_id }}
          restore-keys: |
            gold-monitor-mirror-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      - name: Smoke Test
        run: |
          python -m compileall src
          python -c "import sys; sys.path.insert(0, 'src'); import main"

      - name: Execute

        env:

          SCHEDULED_RUN: ${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'analyze') && 'true' || 'false' }}

          # Without this Python block-buffers stdout into a pipe, so a run killed by the
          # job timeout discards its entire log. The runs that fail are exactly the ones
          # whose output is lost, leaving no way to see where they stalled.
          # Read-only report wing. Set independently of SCHEDULED_RUN so a report can
          # never be mistaken for an Analyze run and start writing history.
          REPORT_ONLY: ${{ github.event.inputs.mode == 'report' && 'true' || 'false' }}

          # Read-only DIRECTION wing (SP-D): renders the panel the scheduled runs stored
          # at 06:00 and 13:00 Tehran. Computes nothing and writes nothing.
          DIRECTION_ONLY: ${{ github.event.inputs.mode == 'direction' && 'true' || 'false' }}

          PYTHONUNBUFFERED: "1"

          CANDLE_CACHE_FILE: candle_cache.json
          RECORD_SPOOL_FILE: record_spool.jsonl
          RECORD_MIRROR_FILE: record_mirror.sqlite

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}

          # The data relay (src/worker/data-relay.js): Daric and TSETMC refuse GitHub's
          # runner, so collectors fall back to the relay when both are set. Unset, they
          # behave exactly as before (SP_D_HANDOFF.md section 10).
          RELAY_URL: ${{ secrets.RELAY_URL }}

          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}

        run: |

          python src/main.py
