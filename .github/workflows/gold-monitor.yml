name: Gold Premium Monitor

# The Analyze path requires SCHEDULED_RUN=true. A plain workflow_dispatch is not a
# schedule event, so an external scheduler posting to the dispatches endpoint would
# otherwise silently run the UPDATE path and produce no analytical history.
# The caller therefore declares intent, which keeps the Live and Analyze wings separate:
# a user /Update stays UPDATE, and only an explicit mode=analyze runs the pipeline.

run-name: >-
  ${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'analyze')
      && 'ANALYZE' || 'UPDATE' }}

on:

  workflow_dispatch:
    inputs:
      mode:
        description: "Which wing to run"
        type: choice
        required: false
        default: update
        options:
          - update
          - analyze

  schedule:
    - cron: "30 14 * * *"

jobs:

  run:

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - uses: actions/checkout@v4

      - name: Restore State
        uses: actions/cache@v4
        with:
          path: state.json
          key: gold-monitor-state-${{ github.run_id }}
          restore-keys: |
            gold-monitor-state-

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      - name: Smoke Test
        run: |
          python -m compileall src
          python -c "import sys; sys.path.insert(0, 'src'); import main"

      - name: Execute

        env:

          SCHEDULED_RUN: ${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'analyze') && 'true' || 'false' }}

          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          DATABASE_URL: ${{ secrets.DATABASE_URL }}

        run: |

          python src/main.py
